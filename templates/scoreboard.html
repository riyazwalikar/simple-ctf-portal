{% extends "base.html" %}
{% block content %}
<div class="scoreboard-page">
  <h2>Scoreboard</h2>

  {% if scores %}
  <div class="table-scroll">
    <table class="table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        {% for entry in scores %}
        <tr>
          <td>{{ loop.index }}</td>
          <td>{{ entry.display_name }}</td>
          <td>{{ entry.score }} pts</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <p class="muted">No scores yet. Solve some challenges!</p>
  {% endif %}
</div>
{% endblock %}
